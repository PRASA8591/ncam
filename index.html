<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRN Document Scanner</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e2e8f0;
            color: var(--dark);
            padding: 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--primary);
        }

        /* API Key Section */
        .api-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .api-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 6px;
            font-size: 14px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #cbd5e1;
            color: var(--dark);
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Camera Box */
        .camera-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 3/4;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-capture { background: var(--success); }
        .btn-upload { background: #475569; }
        .btn-danger { background: var(--danger); }

        /* Status Messages */
        .status {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status.loading { display: block; background: #fef9c3; color: #854d0e; }
        .status.success { display: block; background: #dcfce7; color: #166534; }
        .status.error { display: block; background: #fee2e2; color: #991b1b; }

        /* Saved Data Table */
        .saved-section {
            display: none;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f1f5f9;
            font-weight: 700;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .del-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .action-row .btn {
            flex: 1;
            font-size: 14px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 GRN Auto Scanner</h2>

    <!-- API Key Input -->
    <div class="api-box">
        <label style="font-size: 13px; font-weight: bold;">🔑 Gemini API Key (නොමිලේ ගන්න පුළුවන්):</label>
        <input type="password" id="apiKey" placeholder="ඔයාගේ Gemini API Key එක මෙතනට දාන්න...">
        <small style="display: block; margin-top: 5px; font-size: 12px; color: #475569;">
            Key එකක් නැත්නම් <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> එකෙන් තත්පරයෙන් හදාගන්න. (මේක ඔයාගේ ෆෝන් එකේ සේව් වෙලා තියෙයි).
        </small>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tabScanner" onclick="switchTab('scanner')">📷 Camera Scanner</button>
        <button class="tab-btn" id="tabSaved" onclick="switchTab('saved')">📋 Saved Data (<span id="count">0</span>)</button>
    </div>

    <!-- Scanner View -->
    <div id="scannerView">
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-capture" id="captureBtn" onclick="captureAndScan()">
                📸 ෆොටෝ ගහලා Scan කරන්න
            </button>
            
            <label class="btn btn-upload" for="fileInput">
                🖼️ ගැලරියෙන් ෆොටෝ එකක් තෝරන්න
            </label>
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="uploadAndScan(event)">
        </div>

        <div id="statusBox" class="status"></div>
    </div>

    <!-- Saved Data View -->
    <div id="savedView" class="saved-section">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>GRN No</th>
                        <th>Distributor Name</th>
                        <th>GRN Invoice No</th>
                        <th>Total Payable</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dataList">
                    <!-- Data will load here -->
                </tbody>
            </table>
        </div>

        <div class="action-row">
            <button class="btn btn-capture" onclick="exportCSV()">📥 Download Excel (CSV)</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ ඔක්කොම මකන්න</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusBox = document.getElementById('statusBox');
    const apiKeyInput = document.getElementById('apiKey');
    const captureBtn = document.getElementById('captureBtn');

    // Load saved API key and Data on startup
    let savedList = JSON.parse(localStorage.getItem('grn_saved_data') || '[]');
    apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
    updateBadgeCount();

    apiKeyInput.addEventListener('input', () => {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    // Initialize Back Camera
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { ideal: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            });
            video.srcObject = stream;
        } catch (err) {
            showStatus('කැමරාව ඔන් කරගන්න බැරි වුණා. ගැලරියෙන් ෆොටෝ දාන්න පුළුවන්.', 'error');
        }
    }

    startCamera();

    // Switch between Camera and Saved Data
    function switchTab(tab) {
        if (tab === 'scanner') {
            document.getElementById('scannerView').style.display = 'block';
            document.getElementById('savedView').style.display = 'none';
            document.getElementById('tabScanner').classList.add('active');
            document.getElementById('tabSaved').classList.remove('active');
        } else {
            document.getElementById('scannerView').style.display = 'none';
            document.getElementById('savedView').style.display = 'block';
            document.getElementById('tabScanner').classList.remove('active');
            document.getElementById('tabSaved').classList.add('active');
            renderTable();
        }
    }

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = 'status ' + type;
    }

    // Capture from Live Camera
    async function captureAndScan() {
        const key = apiKeyInput.value.trim();
        if (!key) {
            alert('මචන්, වැඩේ පටන් ගන්න කලින් උඩ තියෙන කොටුවට Gemini API Key එක දාන්න!');
            return;
        }

        if (!video.videoWidth) {
            showStatus('කැමරාව තාම ලෑස්ති නැහැ, තත්පරයක් ඉන්න!', 'error');
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64Image = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
        await analyzeDocument(base64Image, key);
    }

    // Upload from Gallery
    function uploadAndScan(event) {
        const key = apiKeyInput.value.trim();
        if (!key) {
            alert('මචන්, වැඩේ පටන් ගන්න කලින් උඩ තියෙන කොටුවට Gemini API Key එක දාන්න!');
            event.target.value = '';
            return;
        }

        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64Image = e.target.result.split(',')[1];
            await analyzeDocument(base64Image, key);
            event.target.value = ''; // Reset input
        };
        reader.readAsDataURL(file);
    }

    // Send Image to Gemini AI for 100% Exact Extraction
    async function analyzeDocument(base64Data, apiKey) {
        captureBtn.disabled = true;
        showStatus('⏳ Document එක Scan කරමින් පවතී...', 'loading');

        const prompt = `Analyze this GRN document image and extract these 4 fields EXACTLY as printed on the paper. Do not alter characters, spacing, or punctuation. If Distributor Name spans two lines, combine it cleanly with a single space.
Fields required:
1. "grnNo" (value next to GRN No :)
2. "distributorName" (value next to Distributor Name :)
3. "grnInvoiceNo" (value next to GRN Invoice No :)
4. "totalPayable" (printed value next to Total Payable :)

Return ONLY a valid JSON object with keys: "grnNo", "distributorName", "grnInvoiceNo", "totalPayable".`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                        ]
                    }],
                    generationConfig: {
                        response_mime_type: "application/json"
                    }
                })
            });

            const result = await response.json();

            if (result.error) {
                throw new Error(result.error.message);
            }

            const rawText = result.candidates[0].content.parts[0].text;
            const extracted = JSON.parse(rawText);

            const newItem = {
                id: Date.now(),
                grnNo: extracted.grnNo || 'N/A',
                distributorName: extracted.distributorName || 'N/A',
                grnInvoiceNo: extracted.grnInvoiceNo || 'N/A',
                totalPayable: extracted.totalPayable || 'N/A'
            };

            savedList.push(newItem);
            localStorage.setItem('grn_saved_data', JSON.stringify(savedList));
            updateBadgeCount();

            showStatus(`✅ සේව් වුණා! GRN: ${newItem.grnNo} | Total: ${newItem.totalPayable}`, 'success');

        } catch (err) {
            console.error(err);
            showStatus('❌ Scan කරගන්න බැරි වුණා: ' + err.message, 'error');
        } finally {
            captureBtn.disabled = false;
        }
    }

    function updateBadgeCount() {
        document.getElementById('count').textContent = savedList.length;
    }

    function renderTable() {
        const tbody = document.getElementById('dataList');
        tbody.innerHTML = '';

        if (savedList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 20px;">තාම කිසිම Data එකක් සේව් කරලා නැහැ.</td></tr>`;
            return;
        }

        savedList.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td style="font-weight:bold;">${item.grnNo}</td>
                <td>${item.distributorName}</td>
                <td>${item.grnInvoiceNo}</td>
                <td style="font-weight:bold; color:#16a34a;">${item.totalPayable}</td>
                <td><button class="del-btn" onclick="deleteRecord(${item.id})">මකන්න</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteRecord(id) {
        savedList = savedList.filter(item => item.id !== id);
        localStorage.setItem('grn_saved_data', JSON.stringify(savedList));
        updateBadgeCount();
        renderTable();
    }

    function clearAll() {
        if (confirm('සේව් කරපු ඔක්කොම ඩේටා මකන්නද?')) {
            savedList = [];
            localStorage.removeItem('grn_saved_data');
            updateBadgeCount();
            renderTable();
        }
    }

    // Export to Excel CSV
    function exportCSV() {
        if (savedList.length === 0) {
            alert('Download කරන්න ඩේටා නැහැ!');
            return;
        }

        let csv = 'No,GRN No,Distributor Name,GRN Invoice No,Total Payable\n';
        savedList.forEach((item, idx) => {
            const row = [
                idx + 1,
                `"${item.grnNo}"`,
                `"${item.distributorName}"`,
                `"${item.grnInvoiceNo}"`,
                `"${item.totalPayable}"`
            ];
            csv += row.join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `GRN_Data_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    }
</script>

</body>
</html>
